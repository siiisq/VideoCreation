<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin.woff2") format("woff2"); font-weight: 700 900; unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2"); font-weight: 700 900; unicode-range: U+0100-024F; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root {
        position: relative; width: 100%; height: 100%;
        /* paleta del reel de la cebolla */
        --fg: #fff7ec; --bg: transparent; --accent: #ffc23d; --accent-2: #9be15d;
        --font-display: "Montserrat", sans-serif;
      }
      .slot { position: absolute; left: 0; width: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="60">
      <!-- 1) "¿POR QUÉ" explota en letras y se reensambla -->
      <div class="slot" id="por-que" style="top: 200px; height: 400px"
           data-composition-id="cse" data-composition-src="compositions/components/char-slam-explode.html"
           data-start="0" data-duration="8" data-track-index="0"
           data-variable-values='{"text":"¿POR QUÉ","accent":"blue","spread":"wild"}'></div>
      <!-- 2) "LLORAS" cae de golpe con sacudida -->
      <div class="slot" id="lloras" style="top: 350px; height: 380px; --hs-font-size: 17cqw"
           data-composition-id="hs" data-composition-src="compositions/components/headline-slam.html"
           data-start="0.55" data-duration="7.45" data-track-index="1"
           data-variable-values='{"text":"LLORAS","accent_word_index":0,"accent":"blue"}'></div>
      <!-- 3) "al cortar cebolla?" con rotulador que tacha "cebolla" -->
      <div class="slot" id="cebolla" style="top: 450px; height: 560px"
           data-composition-id="mh" data-composition-src="compositions/components/marker-highlight.html"
           data-start="1.1" data-duration="6.9" data-track-index="2"
           data-variable-values='{"text":"AL CORTAR CEBOLLA?","emphasis_word":"CEBOLLA","style":"circle","draw_at":0.7,"accent":"violet"}'></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
