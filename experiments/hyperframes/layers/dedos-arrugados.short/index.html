<!doctype html>
<html lang="es" data-resolution="portrait">

<style>

  .slot { position: absolute; left: 0; width: 1080px; }
  #root[data-composition-id="layer"] { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Montserrat", sans-serif; }
  .cap { position: absolute; left: 70px; right: 70px; top: 1450px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; opacity: 0; }
  .cap span { font-weight: 900; font-size: 62px; line-height: 1.15; text-transform: uppercase; padding: 4px 20px; border-radius: 40px; color: #e9ecf1;
              text-shadow: 0 4px 18px rgba(0,0,0,.55); background: rgba(0,0,0,0); opacity: 0; }
  .cap.high { top: 1230px; }
  /* estilo "select": arriba, palabras dichas en gris, palabra clave con recuadro de selección y tiradores */
  .cap.sel { top: 236px; left: 80px; right: 80px; gap: 4px 16px; }
  .cap.sel span { position: relative; font-weight: 800; font-size: 58px; text-transform: none; padding: 2px 8px; border-radius: 6px;
                  text-shadow: 0 3px 16px rgba(0,0,0,.75); }
  .cap.sel .box { position: absolute; inset: -2px -4px; border: 3px solid #f2b84b; border-radius: 4px; opacity: 0; }
  .cap.sel .box b { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid #f2b84b; }
  .cap.sel .box b.a { left: -9px; top: -9px; }
  .cap.sel .box b.z { right: -9px; bottom: -9px; }
  .p { position: absolute; left: 540px; top: 1420px; border-radius: 50%; opacity: 0; }
  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(16, 1fr); }
  .grid div { transform: scale(0); }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="layer" data-start="0" data-duration="25.8" data-width="1080" data-height="1920" data-fps="60">

  <div id="parts"></div>
  <div class="grid" id="grid"></div>
  <div class="flash" id="flash"></div>

</div>

  const tl = gsap.timeline({ paused: true });
  const A = D.theme.accent, A2 = D.theme.accent2, BG = D.theme.bg1;
  // destello del gancho
  tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.8, duration: 0.05 }, D.flash).to("#flash", { opacity: 0, duration: 0.35 }, D.flash + 0.05);
  // subtítulos karaoke
  const caps = document.getElementById("caps");
  if (D.capStyle === "select") D.chunks.forEach((c) => {

    tl.to("#grid div", { scale: 1.03, duration: 0.22, ease: "power2.in", stagger: { each: 0.0018, from: froms[i % 5], grid: [16, 9] } }, t0 - 0.52);
